name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # L1 + L2 (pg-mem) + L3, lint, typecheck, build, bağımlılık denetimi
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Forbidden packages
        run: |
          if npm ls xlsx --all >/dev/null 2>&1; then echo "::error::xlsx (SheetJS npm) yasaklı — ADR-0001"; exit 1; fi

  
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}